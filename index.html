    <!-- ══════════════════════════════════════════════════════════════
         PWA install-prompt banner markup + logic
         Vanilla JS, independent of the React app — runs regardless of
         how main.jsx mounts.

         NOTE: the install-intent flag is stored in BOTH sessionStorage
         AND a cookie, redundantly. Reasoning:
           - sessionStorage is the "normal" mechanism, but a token-expiry
             auth guard that calls sessionStorage.clear() (or
             localStorage.clear()) during its redirect to /auth would
             silently wipe a sessionStorage-only flag before this script
             gets to act on it.
           - A cookie is untouched by sessionStorage.clear()/
             localStorage.clear(), so it survives that specific case.
           - Some environments (rare privacy modes, certain extensions)
             restrict cookies but leave sessionStorage alone — the
             reverse of the above.
         Writing to both and reading with OR means either one surviving
         is enough; neither is a single point of failure for the other.
         ══════════════════════════════════════════════════════════════ -->
    <div id="gr-install-root">
      <div class="gi-card">
        <div class="gi-icon">⚡</div>
        <div class="gi-body">
          <div class="gi-title" id="gi-title">Install Ghostroute MegaApp</div>
          <div class="gi-sub" id="gi-sub">Add Ghostroute to your device for one-tap access to every tool.</div>
        </div>
        <div class="gi-actions">
          <button type="button" class="gi-btn gi-btn-primary" id="gi-install-btn">Install</button>
          <button type="button" class="gi-btn gi-btn-ghost" id="gi-dismiss-btn">Not now</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var INSTALL_DELAY_MS = 4000; // let the banner breathe instead of slapping it up instantly
        var INTENT_COOKIE = 'gr_install_intent';
        var INTENT_KEY = 'gr-install-intent';

        // ── Merged install-intent flag: sessionStorage + cookie ──────
        function setInstallIntent() {
          try { sessionStorage.setItem(INTENT_KEY, '1'); } catch (e) {}
          try { document.cookie = INTENT_COOKIE + '=1; path=/; max-age=300; SameSite=Lax'; } catch (e) {}
        }

        function hadInstallIntent() {
          var fromSession = false;
          try { fromSession = sessionStorage.getItem(INTENT_KEY) === '1'; } catch (e) {}

          var fromCookie = false;
          try {
            fromCookie = document.cookie.split('; ').some(function (row) {
              return row === INTENT_COOKIE + '=1';
            });
          } catch (e) {}

          return fromSession || fromCookie;
        }

        function clearInstallIntent() {
          try { sessionStorage.removeItem(INTENT_KEY); } catch (e) {}
          try { document.cookie = INTENT_COOKIE + '=; path=/; max-age=0'; } catch (e) {}
        }

        // Capture install intent from the URL the instant this script runs —
        // before the React app mounts and its auth redirect (e.g. to /auth)
        // can strip "?install=1" off the URL.
        try {
          var incomingParams = new URLSearchParams(window.location.search);
          if (incomingParams.get('install') === '1') {
            setInstallIntent();
          }
        } catch (e) { /* URLSearchParams unavailable — degrade to manual click only */ }

        var root = document.getElementById('gr-install-root');
        var titleEl = document.getElementById('gi-title');
        var subEl = document.getElementById('gi-sub');
        var installBtn = document.getElementById('gi-install-btn');
        var dismissBtn = document.getElementById('gi-dismiss-btn');
        var deferredPrompt = null;

        function isStandalone() {
          return (
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true
          );
        }

        function isIOS() {
          return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
        }

        function show() { root.classList.add('gi-show'); }
        function hide() { root.classList.remove('gi-show'); }

        if (isStandalone()) {
          // Already installed and running as the app — nothing to do.
          clearInstallIntent();
        } else if (isIOS()) {
          // iOS Safari has no beforeinstallprompt API — show manual steps,
          // just delayed so it's not instant.
          titleEl.textContent = 'Install Ghostroute MegaApp';
          subEl.textContent = 'Tap the Share icon, then "Add to Home Screen".';
          installBtn.textContent = 'Got it';
          installBtn.addEventListener('click', function () { hide(); clearInstallIntent(); });
          dismissBtn.addEventListener('click', function () { hide(); clearInstallIntent(); });
          setTimeout(show, INSTALL_DELAY_MS);
        } else {
          // Chrome / Edge / Android / most desktop browsers.
          window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            deferredPrompt = e;

            setTimeout(function () {
              if (!deferredPrompt) return; // installed/dismissed while we waited

              if (hadInstallIntent()) {
                // User explicitly asked for this from the home-page banner —
                // go straight to the native prompt instead of a second click.
                deferredPrompt.prompt();
                deferredPrompt.userChoice.finally(function () {
                  deferredPrompt = null;
                  hide();
                  clearInstallIntent();
                });
              } else {
                show();
              }
            }, INSTALL_DELAY_MS);
          });

          installBtn.addEventListener('click', function () {
            if (!deferredPrompt) { hide(); return; }
            deferredPrompt.prompt();
            deferredPrompt.userChoice.finally(function () {
              deferredPrompt = null;
              hide();
              clearInstallIntent();
            });
          });

          dismissBtn.addEventListener('click', function () { hide(); clearInstallIntent(); });
          window.addEventListener('appinstalled', function () { hide(); clearInstallIntent(); });
        }

        // Register the service worker (required by most browsers for
        // installability, and gives a basic offline fallback).
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () {
              /* silent — installability just falls back to browser default UI */
            });
          });
        }
      })();
    </script>
